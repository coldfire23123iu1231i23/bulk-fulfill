<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- App Bridge: phai nam truoc moi script khac -->
<meta name="shopify-api-key" content="%SHOPIFY_API_KEY%">
<script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
<title>Bulk Fulfill — Loom Custom</title>
<style>
:root{
  --bg:#faf7f2; --panel:#fff; --line:#e8e0d5; --line2:#f1ebe2;
  --ink:#2e2a25; --muted:#8a7f72; --accent:#c8703f; --accent-soft:#fdf1e8;
  --ok:#2f7d54; --ok-soft:#e9f5ee; --warn:#b4720d; --warn-soft:#fdf3e0;
  --err:#b3392f; --err-soft:#fdecea; --radius:10px;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#1c1a18; --panel:#25221f; --line:#3a3531; --line2:#312d29;
    --ink:#f0ebe4; --muted:#a89c8e; --accent:#e08a54; --accent-soft:#3a2a1f;
    --ok:#6cc493; --ok-soft:#1e3328; --warn:#e0a94a; --warn-soft:#372c15;
    --err:#f08a80; --err-soft:#3a2321; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}

header{position:sticky;top:0;z-index:20;background:var(--panel);
  border-bottom:1px solid var(--line);padding:10px 16px;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;letter-spacing:-.2px}
.brand span{color:var(--accent)}
.pill{font-size:12px;color:var(--muted);background:var(--bg);
  border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.spacer{flex:1}

.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:7px 13px;cursor:pointer;font-weight:500;transition:.12s}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:#fff}
.btn.sm{padding:4px 9px;font-size:12.5px}

main{padding:14px 16px 70px;max-width:1500px;margin:0 auto}
body.embedded{background:transparent}
body.embedded #logoutBtn{display:none}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:11px 13px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.f input,.f select{background:var(--bg);border:1px solid var(--line);
  border-radius:7px;padding:6px 9px;min-width:130px}
.f input:focus,.f select:focus{outline:none;border-color:var(--accent)}
label.chk{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;padding-bottom:6px}

table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);min-width:1150px}
th{background:var(--bg);text-align:left;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.4px;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:10}
td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:none}
tr.sel{background:var(--accent-soft)}
tr.done{opacity:.5}
.wrap{overflow:auto;border-radius:var(--radius);max-height:calc(100vh - 195px);
  border:1px solid var(--line);background:var(--panel)}

.ord{font-weight:700;font-size:14px;text-decoration:none;color:var(--ink)}
.ord:hover{color:var(--accent)}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.items{display:flex;flex-direction:column;gap:5px;max-width:330px}
.item{display:flex;gap:7px;align-items:flex-start;font-size:12.5px}
.item img{width:32px;height:32px;object-fit:cover;border-radius:5px;border:1px solid var(--line);flex:0 0 32px}
.item .ph{width:32px;height:32px;border-radius:5px;background:var(--bg);border:1px solid var(--line);flex:0 0 32px}
.qty{font-weight:700;color:var(--accent);flex:0 0 auto}
.sku{color:var(--muted);font-size:11.5px;font-family:ui-monospace,monospace}

input.trk{width:210px;background:var(--bg);border:1px solid var(--line);
  border-radius:7px;padding:7px 9px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:12.5px}
input.trk:focus{outline:none;border-color:var(--accent);background:var(--panel)}
input.trk.filled{border-color:var(--ok)}
select.car{background:var(--bg);border:1px solid var(--line);border-radius:7px;
  padding:6px 8px;font-size:12.5px;max-width:165px;width:100%}
.carcell{display:flex;flex-direction:column;gap:5px;max-width:175px}
input.trkurl{width:100%;background:var(--bg);border:1px dashed var(--line);border-radius:7px;
  padding:6px 8px;font-size:11.5px;font-family:ui-monospace,SFMono-Regular,monospace}
input.trkurl:focus{outline:none;border-style:solid;border-color:var(--accent);background:var(--panel)}
input.trkurl.bad{border-style:solid;border-color:var(--err)}
.urlhint{font-size:10.5px;color:var(--muted);line-height:1.35}
.urlhint.bad{color:var(--err)}
.urlhint code{font-size:10.5px;background:var(--bg);padding:0 3px;border-radius:3px}
.guess{font-size:11px;margin-top:3px;color:var(--muted)}
.guess.auto{color:var(--ok)}
.guess.unsure{color:var(--warn)}

.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:99px;
  border:1px solid var(--line);color:var(--muted);background:var(--bg)}
.tag.partial{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.err{background:var(--err-soft);color:var(--err);border-color:transparent}

.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);
  border-top:1px solid var(--line);padding:11px 16px;display:flex;gap:12px;
  align-items:center;flex-wrap:wrap;box-shadow:0 -3px 14px rgba(0,0,0,.06)}
.count{font-weight:700}
.msg{padding:11px 13px;border-radius:var(--radius);margin-bottom:12px;font-size:13.5px}
.msg.err{background:var(--err-soft);color:var(--err)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:26px;width:100%;max-width:340px}
.card h1{margin:0 0 4px;font-size:18px}
.card p{margin:0 0 16px;color:var(--muted);font-size:13px}
.card input{width:100%;padding:9px 11px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);margin-bottom:10px}
kbd{background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;
  border-radius:4px;padding:1px 5px;font-size:11px;font-family:ui-monospace,monospace}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);
  color:var(--ink);padding:0;max-width:620px;width:92vw}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-h{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:700}
.dlg-b{padding:14px 18px;max-height:56vh;overflow:auto}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.res{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px}
.res:last-child{border:none}
.bar-prog{height:4px;background:var(--line);border-radius:9px;overflow:hidden;flex:1;min-width:120px}
.bar-prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="center hidden">
  <form class="card" id="loginForm">
    <h1>Bulk Fulfill</h1>
    <p>Nhập mật khẩu để vào app.</p>
    <input type="password" id="pw" placeholder="Mật khẩu" autocomplete="current-password" required>
    <button class="btn primary" style="width:100%" type="submit">Đăng nhập</button>
    <div id="loginErr" class="msg err hidden" style="margin:12px 0 0"></div>
  </form>
</div>

<!-- APP -->
<div id="app" class="hidden">
<header>
  <div class="brand">Bulk <span>Fulfill</span></div>
  <div class="pill" id="shopPill">—</div>
  <div class="spacer"></div>
  <div class="pill">Enter = lưu &amp; nhảy dòng dưới</div>
  <button class="btn sm" id="logoutBtn">Thoát</button>
  <div class="pill hidden" id="embedPill">Đang chạy trong Shopify Admin</div>
</header>

<main>
  <div class="bar">
    <div class="f"><label>Từ ngày</label><input type="date" id="from"></div>
    <div class="f"><label>Đến ngày</label><input type="date" id="to"></div>
    <div class="f"><label>Tìm kiếm</label><input type="text" id="search" placeholder="#1234, email, SKU"></div>
    <div class="f"><label>Số đơn / trang</label>
      <select id="limit"><option>25</option><option selected>50</option><option>100</option></select>
    </div>
    <label class="chk"><input type="checkbox" id="paidOnly" checked> Chỉ đơn đã thanh toán</label>
    <button class="btn primary" id="loadBtn">Tải đơn</button>
    <div class="spacer"></div>
    <div class="f"><label>Đổi carrier hàng loạt</label>
      <select id="bulkCarrier" class="car"><option value="">— giữ tự động —</option></select>
    </div>
  </div>

  <div id="msg" class="msg hidden"></div>

  <div class="wrap">
    <table id="tbl" class="hidden">
      <thead><tr>
        <th style="width:34px"><input type="checkbox" id="all"></th>
        <th style="width:130px">Đơn</th>
        <th style="width:190px">Khách / Địa chỉ</th>
        <th>Sản phẩm</th>
        <th style="width:140px">Shipping</th>
        <th style="width:225px">Mã tracking</th>
        <th style="width:180px">Carrier</th>
        <th style="width:110px">Kết quả</th>
      </tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>

  <div id="empty" class="empty">Bấm <b>Tải đơn</b> để lấy danh sách đơn chưa fulfill.</div>
  <div style="text-align:center;margin-top:14px">
    <button class="btn hidden" id="moreBtn">Tải thêm đơn</button>
  </div>
</main>

<div class="actionbar">
  <span class="count"><span id="selCount">0</span> đơn đã chọn</span>
  <span class="pill" id="readyCount">0 đơn sẵn sàng</span>
  <label class="chk" style="padding:0"><input type="checkbox" id="notify"> Gửi mail báo vận chuyển cho khách</label>
  <div class="spacer"></div>
  <button class="btn" id="fillDown" title="Điền carrier của dòng đầu cho mọi dòng đã chọn">Đồng bộ carrier</button>
  <button class="btn primary" id="fulfillBtn" disabled>Fulfill đơn đã chọn</button>
</div>
</div>

<dialog id="confirmDlg">
  <div class="dlg-h">Xác nhận fulfill</div>
  <div class="dlg-b" id="confirmB"></div>
  <div class="dlg-f">
    <button class="btn" id="confirmNo">Huỷ</button>
    <button class="btn primary" id="confirmYes">Fulfill</button>
  </div>
</dialog>

<dialog id="dlg">
  <div class="dlg-h" id="dlgH">Đang fulfill…</div>
  <div class="dlg-b" id="dlgB"></div>
  <div class="dlg-f"><button class="btn primary" id="dlgClose">Đóng</button></div>
</dialog>

<script src="/app.js"></script>
</body>
</html>
